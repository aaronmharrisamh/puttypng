; ===========================================================================
; addendums.ini - Decisions taken, and work deliberately left for later
;
; This file records choices that the code alone cannot explain: what was
; deferred, why, and what it would cost to do properly. It is not a task list
; and it is not a changelog. Each entry is a decision with a reason.
;
; Add an entry when a decision closes off an option that a reader might later
; wonder about. Remove an entry once the work is done.
; ===========================================================================

[multiple-attachments]
raised = 2026-09-04
status = deferred
decision = One attachment at a time. Text or one file, never both together.
reason = PuttyPNG.encode takes exactly one payload, and the byte layout is
    protocol versioned. Carrying typed text and one or more files in a single
    PuttyPNG needs a container format: a manifest naming each part, then the
    parts themselves. That is a new format, so it belongs in the engine and it
    moves PROTOCOL_VERSION, which breaks every reader built before it.
cost = An envelope built page side would demonstrate the idea today without
    touching the engine, but it would be a throwaway format that the real
    version has to replace, and any PuttyPNG made with it would stop being
    readable when the engine learns the real one.
ready = The home page mockups already choose the chip icon from whether text
    is travelling alongside a file. A plain file icon shows today. A file with
    a plus on it is written and waiting for the day both can go in at once.
next = Design the container in puttypng.js, bump PROTOCOL_VERSION, and teach
    decode to hand back a list of parts rather than one payload.

[oldputtypng-tab]
raised = 2026-09-04
status = done
decision = The playground and its OldPuttyPNG tab are gone. The board is the
    whole tool. Advanced moved across intact and opens under the Make button.
reason = The board covers what the playground covered, and keeping two tools
    on one page meant two of everything: two ways to make, two ways to read,
    two sets of element names, and two behaviours to keep in step.
consequence = The board reads the Advanced drawer in full at the moment of the
    press, so cover, disc, splat, size, security and depth all still reach the
    engine. The board's own defaults fill in only what Advanced did not set:
    the top rung of the ladder as a size ceiling, unless a fixed size is given.
    The meter scales its rung capacities by the chosen depth, because subtle
    holds three eighths of what standard holds and the reading has to say so.
    The board's element ids keep their home prefix. Nothing clashes with them
    any more, but renaming them would only churn the file and the suite.
dropped = The drive fascia and its six readings, the true pixels viewer, the
    phone sheet, the ones and zeros formation, and the result panel with its
    badges. The three Formation controls went with them, because the machine
    whose timing they set no longer exists. Every one of these is in the git
    history at V2.2.0 if it is ever wanted back.
kept = Animation and Celebration are still preferences. Animation now puts a
    still class on the body, which stops every transition on the board.
    Celebration still fires the confetti on a first make and a first read.

[jewel-case-background]
raised = 2026-09-04
status = done
decision = The solid background is a light grey CD jewel case lying on white
    paper that runs to the corners, and the board
    turns it on by default. A Transparent switch under the Make button turns
    it off.
reason = A transparent PuttyPNG stops decoding the moment anything flattens it
    onto a background: the once-clear pixels become opaque and shift the
    indexing. Far more places will carry a fully opaque picture safely, so
    that is the one to hand people first.
consequence = The case fills the square, so every pixel carries data. At 256
    the payload goes from 46,635 bytes to 65,425. The board holds both numbers
    per rung and reads whichever applies, and it scales them again by the
    chosen depth.
    The case is drawn last with destination-over, which puts it behind the
    finished disc, fills the corners, and fills the spindle hole that was
    punched clean through. The disc is drawn at 0.885 of its usual size so the
    case shows around it, which costs no capacity because the case is opaque.
    The case carries fine grain on purpose. A flat near-black field is the
    worst place to hide data at the standard depth, where three bits move a
    dark pixel by a visible step.
measured = The header costs 111 bytes, the same at every size and either way.
    A fixed size is where the engine starts, not where it stops, so any
    capacity search has to pin maxSize as well or it measures nothing but the
    engine's willingness to grow.
engine = ENGINE_VERSION was not moved for this. It is still 2.0.0 while the
    commits are at 2.3.0, which was already true before this work.

[three-version-numbers]
raised = 2026-09-04
status = done
decision = The footer shows three numbers apart: Page, Engine and Protocol.
    PAGE_VERSION lives at the top of scripts.js and is the only source for it.
reason = They move for different reasons and a bug report has to be able to
    name the right one. The page changes with the layout and the wording, the
    engine changes when puttypng.js changes, and the protocol changes only for
    a breaking byte layout.
rule = PAGE_VERSION is the version the commit carries. Move it with the
    release. The engine and protocol numbers are read from the engine at run
    time, so those two can never disagree with the file that is loaded.
open = ENGINE_VERSION is 2.0.0 while the commits are at 2.3.0 and the page is
    at 2.4.0. That drift predates this work and is now visible in the footer,
    which is the honest place for it, but it is still a decision waiting to be
    made: either move ENGINE_VERSION when the engine changes, or say plainly
    that it tracks the protocol rather than the release.

[made-in-usa-note]
raised = 2026-09-04
status = done
decision = A corner note in the masthead carries a simplified flag, "Made in
    USA", and the line about nothing being collected.
consequence = It is taken out of the flow at the top right, so the name stays
    centred on the page rather than on whatever space the note leaves it.
    Below 820px there is no corner to sit in without landing on the title, so
    it goes back into the flow above the name and centres with everything else.
    The flag is one symbol, used by both the note and the footer.

[where-the-source-lives]
raised = 2026-09-04
status = done
decision = Source access lives on the Download tab as one of two equal
    choices, plus a small link in the footer. There is no sixth tab and no
    page on the site that repeats the README.
reason = Somebody who only wants to make or open a PuttyPNG should never have
    to step around source control to do it, and a developer looking for the
    code already looks under Download. A dedicated tab would put a
    contributor's concern next to Make and Load, which are for everyone.
consequence = The two choices share a row and a height, because neither is the
    small print of the other: one is for dropping the engine into a project,
    the other is for reading it, raising an issue, or taking the whole thing.
    Below 700px they stack, still equal.
    REPO_URL sits beside PAGE_VERSION in scripts.js and the footer is built
    from it. The Download tab carries the same address in its markup, which is
    the one place the two could drift; the suite checks they match.
found = .btn never cleared the browser's underline, so every link wearing that
    class had an underlined label. It was there before this work and showed up
    the moment two buttons sat side by side.
sequencing = The link is written but should not be promoted until the
    repository cleanup lands. See the note in this file about what is tracked.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <!-- PuttyPNG mark: a clay peel exposes the binary inside a shareable disc. -->
  <title id="title">PuttyPNG disc mark</title>
  <desc id="desc">A compact disc with a peel of warm clay revealing binary digits.</desc>

  <defs>
    <clipPath id="disc-clip"><circle cx="32" cy="32" r="28" /></clipPath>
  </defs>

  <!-- The disc stays white so it belongs to the site's paper-and-ink system. -->
  <circle cx="32" cy="32" r="29" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
  <g clip-path="url(#disc-clip)">
    <path d="M34 8h22v25c-4-4-8-6-14-7-4-1-7-4-8-8z" fill="#f7ede9" />
    <g fill="#1a1a1a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="4.4" font-weight="700" letter-spacing=".3">
      <text x="37" y="20">101</text>
      <text x="36" y="26">0110</text>
      <text x="36" y="32">1001</text>
      <text x="39" y="38">010</text>
    </g>

    <!-- The uneven edge makes the top layer read as putty rather than paper. -->
    <path d="M6 6h40c2 5 2 11 0 15-3 5-7 8-12 10-4 1-7 4-10 7-4 4-9 7-18 9z" fill="#c96f52" />
    <path d="M35 16c7-2 14 0 19 5-4-1-8 0-12 3-3 3-6 5-10 6 3-5 4-9 3-14z" fill="#a8532f" />
    <path d="M35 16c8-1 13 1 19 5-7-1-12 3-18 9 3-5 3-10-1-14z" fill="#dd8a6d" />
  </g>
  <circle cx="32" cy="32" r="6.3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
  <circle cx="32" cy="32" r="2.2" fill="#f7ede9" />
</svg>

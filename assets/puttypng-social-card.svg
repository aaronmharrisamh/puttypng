<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <!-- PuttyPNG social-card source. Exported PNG is used by social crawlers. -->
  <title id="title">PuttyPNG social card</title>
  <desc id="desc">PuttyPNG hides data inside an ordinary PNG image.</desc>

  <defs>
    <style>
      @font-face {
        font-family: 'PuttyDisplay';
        src: url('../fonts/lobster.woff2') format('woff2');
      }
      .putty { fill: #c96f52; font-family: 'PuttyDisplay', cursive; font-size: 102px; }
      .png { fill: #1a1a1a; font-family: Arial, Helvetica, sans-serif; font-size: 91px; font-weight: 700; letter-spacing: -5px; }
      .copy { fill: #1a1a1a; font-family: Arial, Helvetica, sans-serif; font-size: 31px; letter-spacing: -.6px; }
      .url { fill: #6f6f6f; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2.2px; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ececec" stroke-width="1" />
    </pattern>
  </defs>

  <!-- White space keeps the copy readable in every social preview crop. -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect x="724" width="476" height="630" fill="url(#grid)" opacity=".58" />
  <path d="M0 521C242 482 467 577 710 521v109H0z" fill="#f7ede9" />

  <text class="putty" x="92" y="231">Putty</text>
  <text class="png" x="343" y="226">PNG</text>
  <text class="copy" x="96" y="298">Press your data into a PNG.</text>
  <text class="copy" x="96" y="340">Hand it to anyone.</text>
  <path d="M96 387h268" stroke="#c96f52" stroke-width="7" stroke-linecap="round" />
  <text class="url" x="97" y="460">PUTTYPNG.COM</text>

  <!-- Reuse the mark at card scale. The rounded backing gives the disc lift. -->
  <rect x="748" y="70" width="382" height="382" rx="191" fill="#f7ede9" />
  <image href="puttypng-mark.svg" x="765" y="87" width="348" height="348" />
</svg>
